<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Денежная книга</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#EEF1F5; --ink:#1B2A41; --muted:#6B7A90; --line:#D5DBE4;
    --red:#C4453C; --green:#2E7D5B; --blue:#2C5FBF; --paper:#FFFFFF;
  }
  *{box-sizing:border-box; margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Golos Text",system-ui,sans-serif; font-size:16px; line-height:1.5;
    padding:20px 16px 64px;
  }
  .wrap{max-width:680px; margin:0 auto}
  header{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:28px}
  h1{font-family:"Unbounded"; font-weight:700; font-size:1.15rem; letter-spacing:-.01em}
  select{
    font:inherit; color:var(--ink); background:var(--paper);
    border:1px solid var(--line); border-radius:8px; padding:6px 10px;
  }
  select:focus-visible{outline:2px solid var(--blue); outline-offset:1px}

  /* Хиро: строка баланса как в гроссбухе */
  .ledger{border-top:2px solid var(--ink); border-bottom:1px solid var(--line); padding:20px 0 22px}
  .balance-label{color:var(--muted); font-size:.95rem}
  .balance{font-family:"Unbounded"; font-weight:700; font-size:clamp(2rem,9vw,3rem); letter-spacing:-.02em; margin:2px 0 16px; font-variant-numeric:tabular-nums}
  .balance.neg{color:var(--red)}
  .splitbar{display:flex; height:10px; border-radius:5px; overflow:hidden; background:var(--line)}
  .splitbar .in{background:var(--green)} .splitbar .out{background:var(--red)}
  .splitlegend{display:flex; justify-content:space-between; margin-top:10px; font-size:.95rem}
  .splitlegend b{font-variant-numeric:tabular-nums; font-weight:600}
  .in-t{color:var(--green)} .out-t{color:var(--red)}

  section{margin-top:36px}
  h2{font-family:"Unbounded"; font-weight:500; font-size:.95rem; margin-bottom:14px}
  .chartbox{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:16px}

  /* Категории: горизонтальные полосы */
  .cats .row{display:grid; grid-template-columns:1fr auto; gap:4px 12px; padding:9px 0; border-bottom:1px dotted var(--line)}
  .cats .row:last-child{border-bottom:none}
  .cats .name{font-weight:500}
  .cats .sum{font-variant-numeric:tabular-nums; font-weight:600}
  .cats .bar{grid-column:1 / -1; height:6px; border-radius:3px; background:var(--line); overflow:hidden}
  .cats .bar i{display:block; height:100%; background:var(--red); border-radius:3px}

  /* Журнал операций */
  .journal{background:var(--paper); border:1px solid var(--line); border-radius:12px; overflow:hidden}
  .journal .day{padding:8px 16px; background:var(--bg); color:var(--muted); font-size:.85rem; border-top:1px solid var(--line)}
  .journal .day:first-child{border-top:none}
  .tx{display:flex; justify-content:space-between; gap:12px; padding:11px 16px; border-top:1px solid var(--line)}
  .tx .what .cat{font-weight:500}
  .tx .what .desc{color:var(--muted); font-size:.9rem}
  .tx .amt{font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap}
  .tx .amt.income{color:var(--green)}
  .tx .amt.expense{color:var(--ink)}

  .empty{color:var(--muted); text-align:center; padding:48px 16px}
  .empty a{color:var(--blue)}
  footer{margin-top:48px; color:var(--muted); font-size:.85rem; text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Денежная книга</h1>
    <select id="month" aria-label="Месяц"></select>
  </header>

  <div id="app" hidden>
    <div class="ledger">
      <div class="balance-label" id="balanceLabel">Баланс за месяц</div>
      <div class="balance" id="balance">…</div>
      <div class="splitbar"><div class="in" id="barIn"></div><div class="out" id="barOut"></div></div>
      <div class="splitlegend">
        <span class="in-t">доход <b id="incomeSum"></b></span>
        <span class="out-t">расход <b id="expenseSum"></b></span>
      </div>
    </div>

    <section>
      <h2>Расходы по категориям</h2>
      <div class="chartbox cats" id="cats"></div>
    </section>

    <section>
      <h2>По дням</h2>
      <div class="chartbox"><canvas id="daily" height="190"></canvas></div>
    </section>

    <section>
      <h2>Последние полгода</h2>
      <div class="chartbox"><canvas id="monthly" height="190"></canvas></div>
    </section>

    <section>
      <h2>Журнал</h2>
      <div class="journal" id="journal"></div>
    </section>
  </div>

  <div id="empty" class="empty" hidden>
    Записей пока нет. Напишите боту первую трату — например, «кофе 300».
  </div>

  <footer>Обновляется из Telegram-бота</footer>
</div>

<script>
const KEY = new URLSearchParams(location.search).get("key") || "";
const fmt = n => n.toLocaleString("ru-RU",{maximumFractionDigits:0}) + " ₽";
const MONTHS = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const monthName = m => { const [y,mm] = m.split("-"); return MONTHS[+mm-1] + " " + y; };

Chart.defaults.font.family = '"Golos Text", sans-serif';
Chart.defaults.color = "#6B7A90";
let dailyChart, monthlyChart;

async function load(month){
  const q = new URLSearchParams({key: KEY});
  if (month) q.set("month", month);
  const r = await fetch("/api/summary?" + q);
  if (!r.ok){ document.body.innerHTML = "<p style='padding:40px;text-align:center'>Нет доступа — возьмите свежую ссылку у бота (/dashboard).</p>"; return; }
  const d = await r.json();
  render(d);
}

function render(d){
  const has = d.recent.length > 0 || d.months.length > 0;
  document.getElementById("app").hidden = !has;
  document.getElementById("empty").hidden = has;

  // селектор месяцев
  const sel = document.getElementById("month");
  const list = d.months.includes(d.month) ? d.months : [d.month, ...d.months];
  sel.innerHTML = list.map(m => `<option value="${m}" ${m===d.month?"selected":""}>${monthName(m)}</option>`).join("");
  sel.onchange = () => load(sel.value);

  // баланс
  const bal = d.totals.income - d.totals.expense;
  const balEl = document.getElementById("balance");
  balEl.textContent = (bal>0?"+":"") + fmt(bal);
  balEl.classList.toggle("neg", bal < 0);
  document.getElementById("balanceLabel").textContent = "Баланс · " + monthName(d.month);
  document.getElementById("incomeSum").textContent = fmt(d.totals.income);
  document.getElementById("expenseSum").textContent = fmt(d.totals.expense);
  const total = d.totals.income + d.totals.expense || 1;
  document.getElementById("barIn").style.width = (d.totals.income/total*100) + "%";
  document.getElementById("barOut").style.width = (d.totals.expense/total*100) + "%";

  // категории
  const cats = document.getElementById("cats");
  if (!d.byCategory.length){ cats.innerHTML = "<div class='empty'>Расходов в этом месяце нет</div>"; }
  else {
    const max = d.byCategory[0].total;
    cats.innerHTML = d.byCategory.map(c => `
      <div class="row">
        <span class="name">${c.category}</span>
        <span class="sum">${fmt(c.total)}</span>
        <span class="bar"><i style="width:${Math.max(3, c.total/max*100)}%"></i></span>
      </div>`).join("");
  }

  // по дням
  const labels = d.byDay.map(x => +x.day.slice(8,10));
  dailyChart?.destroy();
  dailyChart = new Chart(document.getElementById("daily"), {
    type: "bar",
    data: { labels, datasets: [
      { label:"Расход", data:d.byDay.map(x=>x.expense), backgroundColor:"#C4453C", borderRadius:3 },
      { label:"Доход", data:d.byDay.map(x=>x.income), backgroundColor:"#2E7D5B", borderRadius:3 },
    ]},
    options: {
      responsive:true,
      scales:{ x:{ grid:{display:false}, stacked:true }, y:{ border:{display:false}, ticks:{callback:v=>v>=1000? (v/1000)+"к" : v}, stacked:true } },
      plugins:{ legend:{position:"bottom", labels:{boxWidth:10, boxHeight:10}}, tooltip:{callbacks:{label:c=>c.dataset.label+": "+fmt(c.raw)}} }
    }
  });

  // по месяцам
  monthlyChart?.destroy();
  monthlyChart = new Chart(document.getElementById("monthly"), {
    type: "bar",
    data: { labels: d.byMonth.map(x=>monthName(x.month).split(" ")[0]), datasets: [
      { label:"Доход", data:d.byMonth.map(x=>x.income), backgroundColor:"#2E7D5B", borderRadius:3 },
      { label:"Расход", data:d.byMonth.map(x=>x.expense), backgroundColor:"#C4453C", borderRadius:3 },
    ]},
    options: {
      responsive:true,
      scales:{ x:{grid:{display:false}}, y:{ border:{display:false}, ticks:{callback:v=>v>=1000? (v/1000)+"к" : v} } },
      plugins:{ legend:{position:"bottom", labels:{boxWidth:10, boxHeight:10}}, tooltip:{callbacks:{label:c=>c.dataset.label+": "+fmt(c.raw)}} }
    }
  });

  // журнал
  const j = document.getElementById("journal");
  let html = "", lastDay = "";
  for (const t of d.recent){
    if (t.day !== lastDay){
      lastDay = t.day;
      const [y,m,dd] = t.day.split("-");
      html += `<div class="day">${+dd} ${monthName(y+"-"+m).split(" ")[0]}</div>`;
    }
    html += `<div class="tx">
      <div class="what"><div class="cat">${t.category}</div>${t.description?`<div class="desc">${t.description}</div>`:""}</div>
      <div class="amt ${t.type}">${t.type==="income"?"+":"−"}${fmt(t.amount)}</div>
    </div>`;
  }
  j.innerHTML = html || "<div class='empty'>Пусто</div>";
}

load();
</script>
</body>
</html>
